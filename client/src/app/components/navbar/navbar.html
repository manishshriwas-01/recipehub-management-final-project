<nav class="navbar">
  <div class="navbar-container">

    <!-- Logo -->
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <span class="logo-icon">🍴</span>
      <span>RecipeHub</span>
    </a>

    <!-- Mobile Menu Button -->
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation -->
    <div class="nav-menu" [class.open]="menuOpen()">

      <!-- Home -->
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()">
        Home
      </a>

      <!-- Recipes -->
      <a
        routerLink="/recipes"
        routerLinkActive="active"
        (click)="closeMenu()">
        Recipes
      </a>

      <!-- AI Assistant -->
      <a
        routerLink="/ai-assistant"
        routerLinkActive="active"
        (click)="closeMenu()">
        🤖 AI Assistant
      </a>

      @if (user()) {

        <!-- My Recipes -->
        <a
          routerLink="/my-recipes"
          routerLinkActive="active"
          (click)="closeMenu()">
          My Recipes
        </a>

        <!-- My Bookings -->
        <a
          routerLink="/my-bookings"
          routerLinkActive="active"
          (click)="closeMenu()">
          📅 My Bookings
        </a>

        <!-- Instructor Dashboard -->
        <a
          routerLink="/instructor-dashboard"
          routerLinkActive="active"
          (click)="closeMenu()">
          👨‍🍳 Instructor
        </a>

        <!-- Favorites -->
        <a
          routerLink="/favorites"
          routerLinkActive="active"
          (click)="closeMenu()"
          class="favorite-link"
          aria-label="Favorites">
          <span class="heart">♥</span>
          <span>Favorites</span>
        </a>

        <!-- Create Recipe -->
        <a
          routerLink="/create-recipe"
          routerLinkActive="active"
          (click)="closeMenu()"
          class="create-btn">
          + Create Recipe
        </a>

        <!-- Admin -->
        @if (user()?.role === 'admin') {

          <a
            routerLink="/manage-recipes"
            routerLinkActive="active"
            (click)="closeMenu()">
            Manage Recipes
          </a>

        }

        <!-- Logout -->
        <button
          type="button"
          class="logout-btn"
          (click)="logout()">
          Logout
        </button>

      } @else {

        <!-- Login -->
        <a
          routerLink="/login"
          routerLinkActive="active"
          (click)="closeMenu()">
          Login
        </a>

        <!-- Register -->
        <a
          routerLink="/register"
          routerLinkActive="active"
          (click)="closeMenu()"
          class="register-btn">
          Get Started
        </a>

      }

    </div>
  </div>
</nav>
